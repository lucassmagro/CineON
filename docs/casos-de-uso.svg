<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" width="1500" height="1160" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>CineON - Diagrama de Casos de Uso</title>
  <defs>
    <marker id="aberta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
    </marker>
    <g id="ator" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round">
      <circle cx="0" cy="-50" r="14"/>
      <line x1="0" y1="-36" x2="0" y2="10"/>
      <line x1="-22" y1="-22" x2="22" y2="-22"/>
      <line x1="0" y1="10" x2="-18" y2="42"/>
      <line x1="0" y1="10" x2="18" y2="42"/>
    </g>
    <style>
      .uc ellipse { fill: #f5f7fb; stroke: #1d1d1f; stroke-width: 1.6; }
      .uc .id { font-size: 12px; fill: #6e6e73; font-weight: 600; letter-spacing: .5px; }
      .uc .nome { font-size: 15px; fill: #1d1d1f; }
      .assoc { stroke: #1d1d1f; stroke-width: 1.4; }
      .inc { stroke: #1d1d1f; stroke-width: 1.4; stroke-dasharray: 7 5; fill: none; }
      .rot { font-size: 12px; fill: #3a3a3c; font-style: italic; }
      .ator { font-size: 15px; fill: #1d1d1f; font-weight: 600; }
    </style>
  </defs>

  <rect width="1500" height="1160" fill="#ffffff"/>

  <!-- fronteira do sistema -->
  <rect x="300" y="20" width="920" height="1090" rx="6" fill="none" stroke="#1d1d1f" stroke-width="1.8"/>
  <text x="320" y="50" font-size="20" font-weight="700" fill="#1d1d1f">CineON</text>

  <!-- associações ator x caso de uso -->
  <g class="assoc">
    <line x1="172" y1="200" x2="370" y2="100"/>
    <line x1="172" y1="200" x2="370" y2="180"/>
    <line x1="172" y1="200" x2="370" y2="260"/>
    <line x1="172" y1="200" x2="370" y2="340"/>

    <line x1="172" y1="630" x2="370" y2="470"/>
    <line x1="172" y1="630" x2="370" y2="560"/>
    <line x1="172" y1="630" x2="370" y2="650"/>
    <line x1="172" y1="630" x2="370" y2="740"/>
    <line x1="172" y1="630" x2="370" y2="830"/>

    <line x1="172" y1="1020" x2="370" y2="1040"/>

    <line x1="1348" y1="260" x2="1150" y2="180"/>
    <line x1="1348" y1="260" x2="1150" y2="380"/>

    <line x1="1348" y1="840" x2="1150" y2="690"/>
    <line x1="1348" y1="840" x2="1150" y2="775"/>
    <line x1="1348" y1="840" x2="1150" y2="860"/>
    <line x1="1348" y1="840" x2="1150" y2="945"/>
    <line x1="1348" y1="840" x2="1150" y2="1030"/>
  </g>

  <!-- generalização: Cliente é um Visitante -->
  <line x1="150" y1="586" x2="150" y2="318" class="assoc"/>
  <path d="M150,300 L140,318 L160,318 Z" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.4"/>

  <!-- include -->
  <line x1="520" y1="436" x2="520" y2="374" class="inc" marker-end="url(#aberta)"/>
  <text x="530" y="410" class="rot">«include»</text>

  <line x1="670" y1="560" x2="850" y2="560" class="inc" marker-end="url(#aberta)"/>
  <text x="760" y="550" class="rot" text-anchor="middle">«include»</text>

  <line x1="858" y1="390" x2="668" y2="476" class="inc" marker-end="url(#aberta)"/>
  <text x="763" y="426" class="rot" text-anchor="middle" transform="rotate(-24.4 763 433)">«include»</text>

  <line x1="885" y1="400" x2="662" y2="547" class="inc" marker-end="url(#aberta)"/>
  <text x="774" y="490" class="rot" text-anchor="middle" transform="rotate(-33.4 774 474)">«include»</text>

  <!-- casos de uso do cliente -->
  <g class="uc">
    <ellipse cx="520" cy="100" rx="150" ry="34"/><text x="520" y="93" text-anchor="middle" class="id">UC01</text><text x="520" y="113" text-anchor="middle" class="nome">Cadastrar-se</text>
    <ellipse cx="520" cy="180" rx="150" ry="34"/><text x="520" y="173" text-anchor="middle" class="id">UC02</text><text x="520" y="193" text-anchor="middle" class="nome">Fazer login</text>
    <ellipse cx="520" cy="260" rx="150" ry="34"/><text x="520" y="253" text-anchor="middle" class="id">UC03</text><text x="520" y="273" text-anchor="middle" class="nome">Ver filmes em cartaz e sessões</text>
    <ellipse cx="520" cy="340" rx="150" ry="34"/><text x="520" y="333" text-anchor="middle" class="id">UC04</text><text x="520" y="353" text-anchor="middle" class="nome">Ver mapa de assentos</text>
    <ellipse cx="520" cy="470" rx="150" ry="34"/><text x="520" y="463" text-anchor="middle" class="id">UC05</text><text x="520" y="483" text-anchor="middle" class="nome">Reservar assentos (temporária)</text>
    <ellipse cx="520" cy="560" rx="150" ry="34"/><text x="520" y="553" text-anchor="middle" class="id">UC06</text><text x="520" y="573" text-anchor="middle" class="nome">Pagar reserva (simulado)</text>
    <ellipse cx="520" cy="650" rx="150" ry="34"/><text x="520" y="643" text-anchor="middle" class="id">UC08</text><text x="520" y="663" text-anchor="middle" class="nome">Ver meus ingressos</text>
    <ellipse cx="520" cy="740" rx="150" ry="34"/><text x="520" y="733" text-anchor="middle" class="id">UC09</text><text x="520" y="753" text-anchor="middle" class="nome">Desistir da reserva</text>
    <ellipse cx="520" cy="830" rx="150" ry="34"/><text x="520" y="823" text-anchor="middle" class="id">UC18</text><text x="520" y="843" text-anchor="middle" class="nome">Cancelar ingressos</text>
    <ellipse cx="520" cy="1040" rx="150" ry="34"/><text x="520" y="1033" text-anchor="middle" class="id">UC17</text><text x="520" y="1053" text-anchor="middle" class="nome">Expirar reservas vencidas</text>
  </g>

  <!-- casos de uso do operador -->
  <g class="uc">
    <ellipse cx="1000" cy="180" rx="150" ry="34"/><text x="1000" y="173" text-anchor="middle" class="id">UC11</text><text x="1000" y="193" text-anchor="middle" class="nome">Validar ingresso na entrada</text>
    <ellipse cx="1000" cy="380" rx="150" ry="34"/><text x="1000" y="373" text-anchor="middle" class="id">UC10</text><text x="1000" y="393" text-anchor="middle" class="nome">Vender no balcão</text>
    <ellipse cx="1000" cy="560" rx="150" ry="34"/><text x="1000" y="553" text-anchor="middle" class="id">UC07</text><text x="1000" y="573" text-anchor="middle" class="nome">Emitir ingressos com código único</text>
    <ellipse cx="1000" cy="690" rx="150" ry="34"/><text x="1000" y="683" text-anchor="middle" class="id">UC12</text><text x="1000" y="703" text-anchor="middle" class="nome">Manter filmes</text>
    <ellipse cx="1000" cy="775" rx="150" ry="34"/><text x="1000" y="768" text-anchor="middle" class="id">UC13</text><text x="1000" y="788" text-anchor="middle" class="nome">Manter salas (gera assentos)</text>
    <ellipse cx="1000" cy="860" rx="150" ry="34"/><text x="1000" y="853" text-anchor="middle" class="id">UC14</text><text x="1000" y="873" text-anchor="middle" class="nome">Manter sessões</text>
    <ellipse cx="1000" cy="945" rx="150" ry="34"/><text x="1000" y="938" text-anchor="middle" class="id">UC15</text><text x="1000" y="958" text-anchor="middle" class="nome">Relatório de vendas e ocupação</text>
    <ellipse cx="1000" cy="1030" rx="150" ry="34"/><text x="1000" y="1023" text-anchor="middle" class="id">UC16</text><text x="1000" y="1043" text-anchor="middle" class="nome">Cadastrar operador</text>
  </g>

  <!-- atores -->
  <use href="#ator" x="150" y="220"/>
  <text x="150" y="288" text-anchor="middle" class="ator">Visitante</text>

  <use href="#ator" x="150" y="650"/>
  <text x="150" y="718" text-anchor="middle" class="ator">Cliente</text>

  <use href="#ator" x="150" y="1040"/>
  <text x="150" y="1108" text-anchor="middle" class="ator">Sistema</text>
  <text x="150" y="1126" text-anchor="middle" class="ator" font-weight="400">(relógio)</text>

  <use href="#ator" x="1370" y="280"/>
  <text x="1370" y="348" text-anchor="middle" class="ator">Operador</text>
  <text x="1370" y="366" text-anchor="middle" class="ator" font-weight="400">(Bilheteria)</text>

  <use href="#ator" x="1370" y="860"/>
  <text x="1370" y="928" text-anchor="middle" class="ator">Operador</text>
  <text x="1370" y="946" text-anchor="middle" class="ator" font-weight="400">(Gerência)</text>
</svg>
