# copiar para /etc/nginx/sites-available/cineon
# app e API no mesmo endereço: o app na raiz e a API em /api, então não tem CORS no navegador.
# quando o domínio estiver apontando pra cá: trocar o server_name e rodar sudo certbot --nginx -d SEU-DOMINIO

server {
    listen 80 default_server;
    server_name _;

    root /var/www/cineon;
    index index.html;

    # a barra no fim do proxy_pass tira o /api antes de repassar (/api/filmes vira /filmes)
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:3000/;
    }

    # as rotas do app são resolvidas no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}
