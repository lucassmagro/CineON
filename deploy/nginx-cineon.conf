# copiar para /etc/nginx/sites-available/cineon
# depois: sudo certbot --nginx -d api.SEU-DOMINIO -d app.SEU-DOMINIO

server {
    listen 80;
    server_name api.SEU-DOMINIO;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:3000;
    }
}

server {
    listen 80;
    server_name app.SEU-DOMINIO;

    root /var/www/cineon;
    index index.html;

    # as rotas do app são resolvidas no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}
