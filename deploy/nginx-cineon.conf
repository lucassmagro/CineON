# copiar para /etc/nginx/sites-available/cineon e depois rodar o certbot (passo 6 do docs/deploy.md).
# o certbot mexe nos blocos com domínio: põe o listen 443, o certificado e o redirecionamento do 80.

# app e API no mesmo endereço: o app na raiz e a API em /api, então não tem CORS no navegador
server {
    listen 80;
    server_name cineon.agp.app.br;

    root /var/www/cineon;
    index index.html;

    # a barra no fim do proxy_pass tira o /api antes de repassar (/api/filmes vira /filmes)
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:3000/;
    }

    # as rotas do app são resolvidas no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# a API sozinha no subdomínio, sem o /api (https://api.cineon.agp.app.br/filmes)
server {
    listen 80;
    server_name api.cineon.agp.app.br;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:3000;
    }
}

# pelo IP continua funcionando em HTTP, de plano B se o DNS falhar
server {
    listen 80 default_server;
    server_name _;

    root /var/www/cineon;
    index index.html;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:3000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
